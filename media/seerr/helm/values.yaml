image:
  registry: ghcr.io
  repository: seerr-team/seerr
  tag: v3.4.1
  pullPolicy: IfNotPresent

env:
  TZ: America/Montreal
  LOG_LEVEL: info

service:
  type: ClusterIP
  port: 5055

ingress:
  enabled: false

config:
  persistence:
    size: 5Gi
    accessModes:
      - ReadWriteMany
    storageClass: nfs-rwx
    name: seerr-config-pvc
    volumeName: seerr-config-nfs-pv

volumes:
 - name: downloads
   persistentVolumeClaim:
     claimName: media-pvc

volumeMounts:
  - name: downloads
    mountPath: /downloads
    readOnly: true
