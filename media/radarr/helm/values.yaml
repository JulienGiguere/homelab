podSecurityContext:
  fsGroup: 911
  fsGroupChangePolicy: "OnRootMismatch"

securityContext:
  runAsUser: 911
  runAsGroup: 911
  runAsNonRoot: true

image:
  repository: ghcr.io/home-operations/radarr
  tag: 6.1.1
  pullPolicy: IfNotPresent

strategy:
  type: Recreate

service:
  main:
    ports:
      http:
        port: 7878

ingress:
  main:
    enabled: false

persistence:
  config:
    enabled: true
    mountPath: /config
    existingClaim: radarr-config-nfs-pvc

  media:
    enabled: true
    mountPath: /downloads
    existingClaim: media-pvc

env:
  TZ: "America/Montreal"
  PUID: "911"
  PGID: "911"

probes:
  liveness:
    enabled: true
    custom: true
    spec:
      exec:
        command:
        - /bin/sh
        - -c
        - curl -f --max-time 20 http://localhost:7878/ping || exit 1
      initialDelaySeconds: 60
      periodSeconds: 15
      successThreshold: 1
      failureThreshold: 5
      timeoutSeconds: 30
